template_id: research.paper.general
template_version: 1.0.0
schema_version: 1.0.0
title: Research Article / Journal Paper
purpose: Report a completed or explicitly bounded research contribution with reproducible methods and
  traceable evidence.
audiences:
- researchers
- reviewers
- editors
- practitioners
guide_mode: false
sections:
- id: front_matter
  title: Front Matter
  required: true
  fields:
  - id: title
    type: string
    required: true
  - id: authors
    type: person_list
    required: true
  - id: abstract
    type: structured_or_unstructured_text
    required: true
  - id: keywords
    type: string_list
    required: true
  - id: article_type
    type: enum
    required: true
    values:
    - original_research
    - methods
    - systems
    - hardware
    - dataset
    - benchmark
    - field_study
    - review
    - short_communication
- id: introduction
  title: Introduction
  required: true
  subsections:
  - context
  - problem_definition
  - state_of_the_art
  - research_gap
  - research_questions
  - objectives
  - contributions
  - paper_organization
- id: related_work
  title: Related Work
  required: true
  subsections:
  - search_scope
  - thematic_review
  - comparative_analysis
  - limitations_of_prior_work
  - distinction_from_present_work
- id: research_method
  title: Research Method and System
  required: true
  subsections:
  - study_design
  - system_architecture
  - materials_components
  - algorithms_models
  - procedures
  - parameters_units
  - calibration
  - implementation_versions
  - ethics_safety
- id: experimental_setup
  title: Experimental / Computational Setup
  required: true
  subsections:
  - environment
  - hardware_software
  - simulation_configuration
  - datasets
  - instruments
  - baselines
  - protocol
  - repetitions
  - exclusions
- id: metrics_analysis
  title: Metrics and Analysis
  required: true
  subsections:
  - primary_metrics
  - secondary_metrics
  - statistical_methods
  - uncertainty
  - sensitivity
  - validity_threats
- id: results
  title: Results
  required: true
  subsections:
  - primary_results
  - secondary_results
  - ablations
  - comparisons
  - failures
  - robustness
- id: discussion
  title: Discussion
  required: true
  subsections:
  - principal_findings
  - interpretation
  - comparison_prior_work
  - implications
  - limitations
  - threats_to_validity
- id: reproducibility
  title: Reproducibility and Open Science
  required: true
  subsections:
  - code_availability
  - data_availability
  - model_availability
  - materials
  - environment_lock
  - run_manifest
  - preregistration_if_any
- id: conclusion
  title: Conclusion
  required: true
- id: declarations
  title: Declarations
  required: true
  subsections:
  - funding
  - conflicts_of_interest
  - author_contributions
  - ethics_approval
  - consent
  - data_availability
  - code_availability
  - acknowledgements
- id: references
  title: References
  required: true
- id: supplementary
  title: Supplementary Material
  required: false
  subsections:
  - extended_methods
  - additional_results
  - datasets
  - source_code
  - CAD_files
  - simulation_models
  - videos
  - checklists
overlays:
- ieee_journal
- acm_article
- target_journal
- systematic_review_prisma
- randomized_trial_consort
- animal_research_arrive
description: Production template. Content is populated from the canonical project model or reviewed author
  input.
